name: Bug report
description: Report incorrect behavior, a crash, or a wrong value
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include a minimal reproduction.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Actual behavior and the error message, if any.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: A small Python snippet and the input values.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: polars_ta_lib version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: polars-version
    attributes:
      label: Polars version
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python / OS
      placeholder: "3.10 / Linux x86_64"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Traceback or logs
      render: text
    validations:
      required: false
