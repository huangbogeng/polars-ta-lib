name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # Main pushes, PRs, and manual runs. Tag pushes use the OS jobs.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pip install maturin pytest numpy "polars==2.1.0" "polars-talib-fast==2.0.0"

      - name: Install package
        run: pip install -e . --no-build-isolation

      - name: Test
        run: pytest -q

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build documentation
        run: |
          pip install "mkdocs>=1.6,<2" mkdocs-material
          python tools/generate_docs.py
          mkdocs build --strict

  os:
    # macOS and Windows are checked on tags and manual dispatches.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pip install maturin pytest numpy "polars==2.1.0" "polars-talib-fast==2.0.0"

      - name: Install package
        run: pip install -e . --no-build-isolation

      - name: Test
        run: pytest -q
