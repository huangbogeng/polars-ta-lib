name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: astral-sh/setup-uv@v5

      - name: Create environment
        shell: bash
        run: uv venv

      - name: Install test dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=.venv/Scripts/python.exe
          else
            PY=.venv/bin/python
          fi
          uv pip install --python "$PY" maturin pytest numpy "polars==2.0.0" "polars-talib-fast==2.0.0"

      - name: Build extension
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=.venv/Scripts/python.exe
          else
            PY=.venv/bin/python
          fi
          VIRTUAL_ENV=.venv "$PY" -m maturin develop --uv

      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=.venv/Scripts/python.exe
          else
            PY=.venv/bin/python
          fi
          "$PY" -m pytest -q

      - name: Build documentation
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=.venv/Scripts/python.exe
          else
            PY=.venv/bin/python
          fi
          uv pip install --python "$PY" "mkdocs>=1.6,<2" mkdocs-material
          "$PY" tools/generate_docs.py
          "$PY" -m mkdocs build --strict

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
