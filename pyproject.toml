[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "polars_ta_lib"
description = "237 TA-Lib indicators as native Polars expression plugins"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/TA-Lib.txt"]
dynamic = ["version"]
dependencies = ["polars>=1.44,<3"]
keywords = [
  "polars",
  "ta-lib",
  "technical-analysis",
  "technical-indicators",
  "quantitative-finance",
  "trading",
  "finance",
  "rust",
  "plugin",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering",
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://huangbogeng.github.io/polars-ta-lib/"
Documentation = "https://huangbogeng.github.io/polars-ta-lib/"
Repository = "https://github.com/huangbogeng/polars-ta-lib"
Issues = "https://github.com/huangbogeng/polars-ta-lib/issues"
Changelog = "https://github.com/huangbogeng/polars-ta-lib/releases"

[tool.maturin]
python-source = "python"
module-name = "polars_ta_lib._internal"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
  "maturin>=1.5,<2.0",
  "pytest>=8",
  "numpy>=1.26",
  "polars-talib-fast==2.0.0",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
]
